dataset: CICIDS2017-Clean
data_dir: ./data
output_dir: ./runs
device: cuda
random_seed: 42
total_timesteps: 1000000
learning_rate: 0.0005
batch_size: 512
minibatch_size: 256
update_epochs: 6
kan_hidden_dim: 64
kan_num_layers: 2
kan_grid_size: 12
kan_spline_order: 3
kan_use_hidden_norm: true
critic_hidden_dim: 128
use_rca: true
rc_target_fpr: 0.01
rc_target_fnr: 0.05
rc_warmup_steps: 30000
use_rapc: true
rapc_epsilon: 0.02
rapc_inner_steps: 3
rapc_fraction: 0.25
rapc_coef: 0.02
rapc_warmup_steps: 50000
rapc_local_risk_mode: max
selection_metric: clean_f1
